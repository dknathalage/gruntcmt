# Runs on PRs to this repo. Builds gruntcmt from the PR, plans the example
# terragrunt project for real (OpenTofu, no cloud), and uses `--out gh` to post
# the results as PR comments — exercising every numbered scenario:
#   01-create  : create (summary fidelity)
#   02-update  : in-place update (resource fidelity)
#   03-replace : forces-replacement (attribute fidelity)
#   04-destroy : destroy (attribute fidelity)
#   05-noop    : no change (folded)
#   06-security: create shown in a dedicated security comment (attribute fidelity)
#
# Note: for pull requests from forks the token is read-only, so the comment steps
# will no-op there. Same-repo PRs (the intended demo) get pull-requests: write.
name: pr-demo

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...

  demo:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build gruntcmt from this PR
        run: |
          go build -o "$RUNNER_TEMP/gruntcmt" ./cmd/gruntcmt
          # Reference by absolute path so it can't be shadowed by a mise `gruntcmt`
          # shim (the repo's own mise.toml declares the go: backend).
          echo "GRUNTCMT=$RUNNER_TEMP/gruntcmt" >> "$GITHUB_ENV"

      # OpenTofu + terragrunt, pinned in examples/terragrunt/mise.toml.
      - uses: jdx/mise-action@v2
        with:
          install: "false"
      - name: Install OpenTofu + terragrunt
        working-directory: examples/terragrunt
        run: mise install

      - name: Run numbered scenarios and post PR comment
        working-directory: examples/terragrunt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          eval "$(mise activate bash)"
          ./plan-scenarios.sh > "$GITHUB_WORKSPACE/s.ndjson"
          "$GRUNTCMT" --scope scenarios --ruleset gruntcmt.yaml --commit "$GITHUB_SHA" --out gh < "$GITHUB_WORKSPACE/s.ndjson"
          "$GRUNTCMT" --scope scenarios --ruleset gruntcmt.yaml --commit "$GITHUB_SHA" < "$GITHUB_WORKSPACE/s.ndjson" >> "$GITHUB_STEP_SUMMARY"
