# Single self-contained ruleset for the scenario units. No `base:` — one file.
rules:
  # Default rule for every unit.
  - path: "**"
    title: "gruntcmt scenarios"
    group-by: 1
    create: summary      # creates: counted in the table, not listed
    update: resource     # updates: address + action line
    delete: attribute    # deletes: full before -> after diff
    replace: attribute   # replacements: full diff (forces-replacement shown)
    noop: summary
  # Pull the security unit into its own comment, at full detail.
  - path: "**/06-security"
    dedicated-comment: true
    scope: security
    title: "Security plan"
    create: attribute
    delete: attribute
